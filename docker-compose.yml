services:
  backend:
    build:
      context: .
      args:
        ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    container_name: myfinance-backend
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=mongodb://mongo:27017
      - DATABASE_NAME=${DATABASE_NAME:-MyFinance_Db}
      - JWT_SECRET=${JWT_SECRET:-your-dev-secret-key}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: myfinance-mongo
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  mongo-express:
    image: mongo-express:latest
    container_name: myfinance-mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo_data:
