# /etc/nginx/sites-available/myfinance-backend
# Reverse proxy + TLS + rate limiting for the MyFinance API.

# Rate-limit zones (define in http{} context, e.g. /etc/nginx/nginx.conf):
#   limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
#   limit_req_zone $binary_remote_addr zone=api:10m   rate=20r/s;

server {
    listen 80;
    server_name api.myfinance.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.myfinance.app;

    ssl_certificate     /etc/letsencrypt/live/api.myfinance.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.myfinance.app/privkey.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 10M;

    location = /api/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
